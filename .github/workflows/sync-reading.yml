name: Sync reading list from Notion

on:
  schedule:
    # 매주 월요일 00:00 UTC = 월요일 09:00 KST
    - cron: "0 0 * * 1"
  workflow_dispatch: # 수동 실행 버튼

permissions:
  contents: write
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/sync-reading.mjs

      - name: Commit & push if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/reading.json assets/reading/covers
            git commit -m "Sync reading list from Notion (automated)"
            git push
            # 봇 커밋은 Pages 재배포를 트리거하지 않으므로 수동으로 빌드 요청
            gh api --method POST "repos/${{ github.repository }}/pages/builds"
          else
            echo "변경 없음 — 커밋 생략"
          fi
