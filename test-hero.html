<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hero Effect Test — Pink Neon + Interior Flicker</title>
  <style>
    :root {
      --pink-pulse-min: 0.00;
      --pink-pulse-max: 0.35;
      --pink-duration: 3s;

      --interior-final: 0.32;
      --interior-color: #ffb454;
      --pink-color: #ff3ea3;

      --bg: #141414;
      --surface: #222;
      --hairline: #333;
      --ink: #fff;
      --muted: #aaa;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 64px;
      gap: 24px;
    }
    h1 { font-size: 1.3rem; margin: 0; }
    p.note { margin: 0; color: var(--muted); font-size: 0.92rem; text-align: center; max-width: 640px; line-height: 1.5; }

    .hero-test {
      position: relative;
      width: 100%;
      max-width: 720px;
      aspect-ratio: 1040 / 585;
      border-radius: 12px;
      overflow: hidden;
      background: #0d0d0d;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
    }
    .hero-test > img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Pink neon pulse */
    .fx-pink {
      position: absolute;
      left: 2%; top: 4%;
      width: 72%; height: 50%;
      pointer-events: none;
      background: radial-gradient(
        ellipse at 50% 55%,
        var(--pink-color) 0%,
        rgba(255, 62, 163, 0.55) 35%,
        rgba(255, 62, 163, 0.0) 75%
      );
      mix-blend-mode: screen;
      opacity: var(--pink-pulse-min);
      filter: blur(6px);
      animation: pink-pulse var(--pink-duration) ease-in-out infinite alternate;
    }
    @keyframes pink-pulse {
      from { opacity: var(--pink-pulse-min); }
      to   { opacity: var(--pink-pulse-max); }
    }

    /* Interior warm light */
    .fx-interior {
      position: absolute;
      left: 50%; top: 48%;
      width: 30%; height: 44%;
      pointer-events: none;
      background: radial-gradient(
        ellipse at 50% 50%,
        var(--interior-color) 0%,
        rgba(255, 180, 84, 0.55) 40%,
        rgba(255, 180, 84, 0.0) 78%
      );
      mix-blend-mode: screen;
      opacity: 0;
      filter: blur(4px);
    }
    .fx-interior.is-playing { animation: interior-flicker 1.8s steps(1, end) forwards; }
    .fx-interior.is-on { opacity: var(--interior-final); }

    @keyframes interior-flicker {
      0%   { opacity: 0; }
      6%   { opacity: calc(var(--interior-final) * 1.1); }
      9%   { opacity: 0; }
      18%  { opacity: 0; }
      23%  { opacity: calc(var(--interior-final) * 0.85); }
      28%  { opacity: 0; }
      40%  { opacity: 0; }
      46%  { opacity: calc(var(--interior-final) * 1.05); }
      52%  { opacity: 0.04; }
      66%  { opacity: calc(var(--interior-final) * 0.7); }
      72%  { opacity: 0.06; }
      85%  { opacity: calc(var(--interior-final) * 1.0); }
      100% { opacity: var(--interior-final); }
    }

    .hero-test.no-pink     .fx-pink     { display: none; }
    .hero-test.no-interior .fx-interior { display: none; }

    .controls, .sliders {
      display: flex; flex-wrap: wrap; gap: 10px 14px;
      justify-content: center; max-width: 720px;
    }
    .sliders { font-size: 0.85rem; color: var(--muted); gap: 12px 18px; }
    .controls button {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--hairline);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .controls button:hover { border-color: #666; }
    .sliders input[type="range"] { accent-color: #ff3ea3; vertical-align: middle; }
    .sliders label { display: inline-flex; align-items: center; gap: 8px; }

    .status {
      font-size: 0.8rem; color: var(--muted); text-align: center;
    }
  </style>
</head>
<body>
  <h1>Hero 효과 테스트 — 핑크 네온 펄스 + 내부 조명 인트로</h1>
  <p class="note">
    실제 hero 이미지 위에 CSS 오버레이 두 개를 겹쳤습니다. 위치는 % 좌표 근사이므로
    필요하면 슬라이더로 조정하고 그 값을 알려주세요.
  </p>

  <div class="hero-test" id="hero">
    <img src="assets/images/hero/main_dark.webp" alt="hero dark" onerror="this.onerror=null; this.src='assets/images/hero/main_dark.png';" />
    <div class="fx-pink"     id="fxPink"></div>
    <div class="fx-interior" id="fxInterior"></div>
  </div>

  <div class="controls">
    <button id="replay">▶ 인트로 다시 재생</button>
    <button id="togglePink">핑크 네온 끔/켬</button>
    <button id="toggleInterior">내부 조명 끔/켬</button>
    <button id="toggleTheme">라이트 모드로 보기</button>
  </div>

  <div class="sliders">
    <label>핑크 최대 밝기
      <input type="range" id="pinkMax" min="0" max="80" value="35" />
      <span id="pinkMaxVal">0.35</span>
    </label>
    <label>핑크 주기(초)
      <input type="range" id="pinkDur" min="10" max="80" value="30" />
      <span id="pinkDurVal">3.0s</span>
    </label>
    <label>내부 최종 밝기
      <input type="range" id="intMax" min="0" max="60" value="32" />
      <span id="intMaxVal">0.32</span>
    </label>
  </div>

  <div class="status" id="status"></div>

  <script>
    const hero = document.getElementById("hero");
    const interior = document.getElementById("fxInterior");
    const root = document.documentElement;
    const status = document.getElementById("status");
    const img = hero.querySelector("img");

    img.addEventListener("load", () => { status.textContent = "이미지 로드 OK · " + img.naturalWidth + "×" + img.naturalHeight; });
    img.addEventListener("error", () => { status.textContent = "⚠ 이미지 로드 실패 — assets/images/hero/ 경로 확인 필요"; });

    function playIntro() {
      interior.classList.remove("is-playing", "is-on");
      void interior.offsetWidth;
      interior.classList.add("is-playing");
    }
    interior.addEventListener("animationend", () => {
      interior.classList.remove("is-playing");
      interior.classList.add("is-on");
    });
    playIntro();

    document.getElementById("replay").addEventListener("click", playIntro);
    document.getElementById("togglePink").addEventListener("click", () => hero.classList.toggle("no-pink"));
    document.getElementById("toggleInterior").addEventListener("click", () => hero.classList.toggle("no-interior"));

    let isDark = true;
    const themeBtn = document.getElementById("toggleTheme");
    themeBtn.addEventListener("click", () => {
      isDark = !isDark;
      if (isDark) {
        img.src = "assets/images/hero/main_dark.webp";
        hero.classList.remove("no-pink", "no-interior");
        themeBtn.textContent = "라이트 모드로 보기";
        playIntro();
      } else {
        img.src = "assets/images/hero/main_light.webp";
        hero.classList.add("no-pink", "no-interior");
        themeBtn.textContent = "다크 모드로 보기";
      }
    });

    const pinkMax = document.getElementById("pinkMax");
    const pinkMaxVal = document.getElementById("pinkMaxVal");
    pinkMax.addEventListener("input", () => {
      const v = pinkMax.value / 100;
      root.style.setProperty("--pink-pulse-max", v.toFixed(2));
      pinkMaxVal.textContent = v.toFixed(2);
    });

    const pinkDur = document.getElementById("pinkDur");
    const pinkDurVal = document.getElementById("pinkDurVal");
    pinkDur.addEventListener("input", () => {
      const v = pinkDur.value / 10;
      root.style.setProperty("--pink-duration", v.toFixed(1) + "s");
      pinkDurVal.textContent = v.toFixed(1) + "s";
    });

    const intMax = document.getElementById("intMax");
    const intMaxVal = document.getElementById("intMaxVal");
    intMax.addEventListener("input", () => {
      const v = intMax.value / 100;
      root.style.setProperty("--interior-final", v.toFixed(2));
      intMaxVal.textContent = v.toFixed(2);
      if (interior.classList.contains("is-on")) interior.style.opacity = v.toFixed(2);
    });
  </script>
</body>
</html>
